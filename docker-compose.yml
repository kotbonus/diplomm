services:
  website:
    build: .
    ports:
      - "8080:8080"
    container_name: my-docker-website
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
