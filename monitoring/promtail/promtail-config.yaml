server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Сбор логов приложения
  - job_name: wishlist-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: wishlist-app
          __path__: /var/log/app/*.log
    pipeline_stages:
      - regex:
          expression: '(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}.\d{3}) (?P<level>\w+) (?P<logger>\S+) (?P<message>.*)'
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000'
      - labels:
          level:
          logger:

  # Сбор логов ошибок
  - job_name: wishlist-app-errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: wishlist-app
          level: error
          __path__: /var/log/app/error.log
    pipeline_stages:
      - regex:
          expression: '(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}.\d{3}) (?P<logger>\S+) (?P<message>.*)'
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000'
