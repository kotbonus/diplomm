<style>
/* Глобальные стили для навигации всего сайта */
:root {
    --primary-color: #6366f1;
    --primary-dark: #4f46e5;
    --secondary-color: #ec4899;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --border-color: #e2e8f0;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
}

.main-navigation {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-color);
    padding: 1rem 0;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: var(--shadow-sm);
}

.nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
}

.nav-brand {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary-color);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.nav-brand i {
    font-size: 1.8rem;
}

.nav-menu {
    display: flex;
    align-items: center;
    gap: 2rem;
    list-style: none;
    margin: 0;
    padding: 0;
}

.nav-link {
    color: var(--text-secondary);
    text-decoration: none;
    font-weight: 500;
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.nav-link:hover {
    color: var(--primary-color);
    background: rgba(99, 102, 241, 0.1);
}

.nav-link.active {
    color: white;
    background: var(--primary-color);
}

@media (max-width: 768px) {
    .nav-menu {
        flex-wrap: wrap;
        gap: 1rem;
    }
    
    .nav-container {
        padding: 0 1rem;
    }
}
</style>

<nav class="main-navigation" th:fragment="navigation">
    <div class="nav-container">
        <div class="d-flex justify-content-between align-items-center">
            <a href="/" class="nav-brand">
                <i class="bi bi-gift-fill"></i>
                <span>Wishlist</span>
            </a>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link">
                    <i class="bi bi-house-door"></i> Главная
                </a></li>
                <li><a href="/about" class="nav-link">
                    <i class="bi bi-info-circle"></i> О сайте
                </a></li>
                                <li><a href="/wishlist" class="nav-link">
                    <i class="bi bi-heart"></i> Wishlist
                </a></li>
                <th:block th:if="${session.currentUser != null}">
                    <li><a href="/friends" class="nav-link">
                        <i class="bi bi-people"></i> Друзья
                    </a></li>
                    <li><a href="/profile" class="nav-link">
                        <i class="bi bi-gear"></i> Личный кабинет
                    </a></li>
                    <li><a href="/auth/logout" class="nav-link">
                        <i class="bi bi-box-arrow-right"></i> Выйти
                    </a></li>
                </th:block>
                <th:block th:if="${session.currentUser == null}">
                    <li><a href="/auth/login" class="nav-link">
                        <i class="bi bi-box-arrow-in-right"></i> Войти
                    </a></li>
                    <li><a href="/auth/register" class="nav-link">
                        <i class="bi bi-person-plus"></i> Регистрация
                    </a></li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>
