<style>
nav {
    margin: 20px 0;
    text-align: center;
}
nav a {
    display: inline-block;
    margin: 0 10px;
    text-decoration: none;
    color: #667eea;
    font-weight: bold;
    padding: 8px 16px;
    border-radius: 5px;
    transition: background-color 0.3s;
    white-space: nowrap;
    position: relative;
}
nav a:hover {
    background-color: #667eea;
    color: white;
}
.notification-badge {
    position: absolute !important;
    top: -8px !important;
    right: -8px !important;
    background: #ff0000 !important;
    background: linear-gradient(135deg, #ff0000, #cc0000) !important;
    color: white !important;
    border-radius: 50% !important;
    width: 24px !important;
    height: 24px !important;
    font-size: 12px !important;
    font-weight: bold !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    border: 2px solid white !important;
    box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.5), 0 2px 10px rgba(255, 0, 0, 0.6) !important;
    animation: pulse 1.5s infinite !important;
    z-index: 1000 !important;
}

@keyframes pulse {
    0% {
        box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.5), 0 2px 10px rgba(255, 0, 0, 0.6);
        transform: scale(1);
    }
    50% {
        box-shadow: 0 0 0 8px rgba(255, 0, 0, 0.3), 0 2px 15px rgba(255, 0, 0, 0.8);
        transform: scale(1.1);
    }
    100% {
        box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.5), 0 2px 10px rgba(255, 0, 0, 0.6);
        transform: scale(1);
    }
}
.friends-link {
    position: relative;
}
</style>

<nav th:fragment="navigation">
    <a href="/">Главная</a>
    <a href="/about">О сайте</a>
    <a href="/wishlist">Wishlist</a>
    
    <th:block th:if="${session.currentUser != null}">
        <a href="/friends" class="friends-link">
            Друзья
            <span th:if="${pendingRequestsCount > 0}" class="notification-badge" th:text="${pendingRequestsCount > 99 ? '99+' : pendingRequestsCount}">0</span>
        </a>
        <a href="/profile">Личный кабинет</a>
        <a href="/auth/logout">Выйти</a>
    </th:block>
    
    <th:block th:if="${session.currentUser == null}">
        <a href="/auth/login">Войти</a>
        <a href="/auth/register">Регистрация</a>
    </th:block>
</nav>
